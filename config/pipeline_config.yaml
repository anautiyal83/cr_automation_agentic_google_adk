openrouter_api_key: "${OPENROUTER_API_KEY}"

models:
  default: "openrouter/google/gemini-2.5-flash"
  per_step:
    1: null  # DOC Parser
    2: null  # DOC Analyzer
    3: "openrouter/google/gemini-2.5-pro"  # CIQ Config Generation — needs stronger model for column matching
    4: null  # Generate CIQ JSON Config
    6: null  # Generate Execution Config
    8: null  # Simulator Setup

retry:
  test_failure_limit: 3
  infrastructure_limit: 3
  infrastructure_backoff: 2.0

external_modules:
  ciq_processor_jar: "./lib/ciq-processor-1.0.3-cli.jar"
  cli_automation_jar: "./lib/cli-automation-standalone.jar"
  execution_report_jar: "./lib/execution-report-generator-1.0.2-cli.jar"
  java_home: null
  subprocess_timeout: 300

simulator:
  endpoint: "localhost"          # host step 8 health-checks and step 9 connects to
  mockwire_jar: "./lib/mockwire.jar"  # built from the MockWire repo (Settings → External Modules → MockWire JAR)
  base_port: 22200               # first port probed; one free port per simulator instance
  ttl_minutes: 60                # MockWire exits on its own after this, if never stopped
  startup_timeout_sec: 30

execution:
  # Passed by the production framework to every execution as `--var NAME=value`.
  # Step 6 may use them as ${NAME} without registering them; step 9 passes these
  # dummy values when executing against the simulator.
  runtime_params:
    ORDER_NO: "TEST_ORDER_NO"
    CHILD_REQ_ID: "TEST_CHILD_REQ"
    PARENT_REQ_ID: "TEST_PARENT_REQ"
    NODE_NAME: "TEST_NODE"
    NIAM_IP: "127.0.0.1"
    M2MPORT: "22"
    M2MUSER: "oamsys"
    M2MPASSWORD: "netconf-sim"
    REPO_IP: "127.0.0.1"
    REPO_USER: "backup"
    REPO_PASSWORD: "netconf-sim"
  # Step 9 on Windows: run the cli-automation JAR inside this WSL distribution, so LOCAL steps behave as on
  # the production (Linux) server (spec 013 PF-D5). Needs Java + python in it and mirrored networking
  # (.wslconfig networkingMode=mirrored) to reach the simulator on localhost. Empty: run on Windows.
  wsl_distro: "Ubuntu-24.04"
  # Where the activity's input files are on the automation server (production: per child request and node);
  # workflows check them there and upload them from there. Empty: the run folder (spec 013 C4)
  local_path: "/mnt/shared_data/${CHILD_REQ_ID}/${NODE_NAME}"
  # Run queue (spec 007): one pipeline runs at a time, the others wait; jobs one user may have waiting
  max_queued_per_user: 3
  # Backups are taken on this server (node `repo_server` of every workflow that uses it; it logs in with the
  # runtime parameters REPO_IP / REPO_USER / REPO_PASSWORD as production workflows do, spec 013)
  repo_server:
    node: "repo_server"
    host: "${REPO_IP}"
    port: "22"
    user: "${REPO_USER}"
    password: "${REPO_PASSWORD}"
    backup_dir: "/repo-server/config/CR_AUTOMATION"
    # The repo server's IPv4 and IPv6 address: with both set, a workflow picks REPO_IP by the IP version the node
    # is reached with (production's `who am i` probe); empty: REPO_IP is a runtime parameter
    ip_v4: ""
    ip_v6: ""

storage:
  database_path: "./data/pipeline.db"
  artifacts_directory: "./data/runs"
  knowledge_base_directory: "./data/knowledge"

chunking:
  ciq_rows_per_chunk: 100
  max_context_tokens: 100000

few_shot:
  enabled: true
  top_k: 3
  embedding_model: "all-MiniLM-L6-v2"

ui:
  host: "0.0.0.0"
  port: 8000
  dark_mode: true
  title: "CR Automation ADK Pipeline"
